<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&amp;family=Share+Tech+Mono&amp;display=swap');

  :root {
    --bg: #05080f;
    --surface: #0a0f1e;
    --accent: #00d4d4;
    --accent2: #ff6b35;
    --text: #c8d8e8;
    --muted: #64748b;
    --border: rgba(0, 212, 212, 0.15);
  }

  .alterra-graph-container {
    margin: 2rem 0;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    position: relative;
    overflow: hidden;
  }

  .graph-details {
    width: 100%;
  }

  .graph-summary {
    padding: 1.25rem 2rem;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    outline: none;
    background: rgba(0, 212, 212, 0.02);
  }

  .graph-summary::-webkit-details-marker { display: none; }
  
  .graph-summary::after {
    content: '[ ACCESS_DATA ]';
    font-size: 0.8rem;
    opacity: 0.6;
    transition: 0.3s ease;
  }

  .graph-details[open] .graph-summary::after {
    content: '[ TERMINATE_LINK ]';
    color: var(--accent2);
  }

  .graph-viewport {
    width: 100%;
    height: 600px;
    position: relative;
    background: #020408;
    display: none; /* Controlled by JS */
  }

  .graph-viewport.active {
    display: block;
  }

  /* Controls Overlay */
  .graph-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
  }

  .zoom-btn {
    width: 40px;
    height: 40px;
    background: rgba(10, 15, 30, 0.8);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    backdrop-filter: blur(4px);
  }

  .zoom-btn:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 15px var(--accent);
  }

  .sidebar-toggle {
    position: absolute;
    left: 20px;
    top: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toggle-item {
    background: rgba(10, 15, 30, 0.8);
    border: 1px solid var(--border);
    padding: 8px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toggle-item.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(0, 212, 212, 0.05);
  }

  .toggle-item:hover {
    border-color: var(--accent);
  }

  .status-bar {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent);
    pointer-events: none;
    text-shadow: 0 0 5px rgba(0, 212, 212, 0.5);
  }

  #prime-canvas {
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .tooltip {
    position: absolute;
    background: rgba(5, 8, 15, 0.9);
    border: 1px solid var(--accent);
    padding: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    pointer-events: none;
    display: none;
    z-index: 200;
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 212, 212, 0.2);
  }
</style>

<div class="alterra-graph-container">
  <div class="graph-header" id="graph-toggle-btn">
    <div class="graph-summary">
      Logarithmic Prime Distribution // Static_Dataset_v1.0
    </div>
  </div>
  <div class="graph-viewport" id="graph-body">
      <div class="sidebar-toggle">
        <div class="toggle-item active" id="toggle-primes">
          <span class="status-indicator">●</span> PRIMES_DETECTED
        </div>
        <div class="toggle-item" id="toggle-six">
          <span class="status-indicator">●</span> MULTIPLES_OF_6
        </div>
      </div>

      <div class="graph-controls">
        <button class="zoom-btn" id="zoom-in" title="Zoom In">+</button>
        <button class="zoom-btn" id="zoom-out" title="Zoom Out">-</button>
        <button class="zoom-btn" id="reset-view" title="Reset View">⟲</button>
      </div>

      <canvas id="prime-canvas"></canvas>
      <div class="tooltip" id="graph-tooltip"></div>
      <div class="status-bar" id="graph-status">SYSTEM_READY // WAITING_FOR_INPUT</div>
      
      <!-- Data Info HUD -->
      <div style="position: absolute; bottom: 20px; right: 20px; font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--muted); text-align: right; pointer-events: none;">
        ENGINE: STATIC_DATASET_CORE<br>
        DATASET: PRIMES_1000 + SIX_1000<br>
        RANGE: 2 - 7919
      </div>
    </div>
  </div>
</div>

    const sixDataset = Array.from({length: 1000}, (_, i) => (i + 1) * 6);

    // Data Generation using Static Datasets
    async function generateData() {
      let i = 0;
      let j = 0;
      const chunkSize = 50;

      return new Promise((resolve) => {
        function processChunk() {
          // Process Primes
          const pEnd = Math.min(i + chunkSize, primeDataset.length);
          for (; i < pEnd; i++) {
            const n = primeDataset[i];
            primes.push({
              n: n,
              r: Math.log(n) * 60,
              theta: n,
              type: 'prime'
            });
          }

          // Process Multiples of 6
          const sEnd = Math.min(j + chunkSize, sixDataset.length);
          for (; j < sEnd; j++) {
            const s = sixDataset[j];
            multiplesOf6.push({
              n: s,
              r: Math.log(s) * 60,
              theta: s,
              type: 'six'
            });
          }

          status.textContent = `MAPPING_DATA... ${Math.max(((i/primeDataset.length)*100), ((j/sixDataset.length)*100)).toFixed(0)}%`;
          draw();

          if (i < primeDataset.length || j < sixDataset.length) {
            setTimeout(processChunk, 0);
          } else {
            resolve();
          }
        }
        processChunk();
      });
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      draw();
    }

    function draw() {
      if (!isInitialized) return;
      
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width / 2 + transform.x, height / 2 + transform.y);
      ctx.scale(transform.k, transform.k);

      // Draw Axes (X and Y)
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(200, 216, 232, 0.3)';
      ctx.lineWidth = 1 / transform.k;
      
      // Horizontal Axis (X)
      ctx.moveTo(-5000, 0);
      ctx.lineTo(5000, 0);
      
      // Vertical Axis (Y)
      ctx.moveTo(0, -5000);
      ctx.lineTo(0, 5000);
      ctx.stroke();

      // Axis Labels
      ctx.fillStyle = 'rgba(200, 216, 232, 0.5)';
      ctx.font = `${12/transform.k}px 'Share Tech Mono'`;
      ctx.fillText('X+', 4800, -10/transform.k);
      ctx.fillText('X-', -4950, -10/transform.k);
      ctx.fillText('Y+', 10/transform.k, -4800);
      ctx.fillText('Y-', 10/transform.k, 4950);

      // Draw Grid Rings
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(0, 212, 212, 0.08)';
      ctx.lineWidth = 1 / transform.k;
      for (let r = 100; r < 5000; r += 100) {
        ctx.arc(0, 0, r, 0, Math.PI * 2);
      }
      ctx.stroke();

      // Draw Points with Clustering/LOD
      if (showPrimes) {
        ctx.fillStyle = '#00d4d4';
        const drawn = new Set();
        const clusterRes = transform.k < 0.5 ? 3 : (transform.k < 1.5 ? 1.5 : 0);

        primes.forEach(p => {
          const x = p.r * Math.cos(p.theta);
          const y = p.r * Math.sin(p.theta);
          
          const vx = (x * transform.k) + transform.x + width/2;
          const vy = (y * transform.k) + transform.y + height/2;
          
          if (vx > -10 && vx < width + 10 && vy > -10 && vy < height + 10) {
            // Clustering logic: skip if a point was already drawn in this pixel area
            if (clusterRes > 0) {
              const cx = Math.floor(vx / clusterRes);
              const cy = Math.floor(vy / clusterRes);
              const key = `${cx},${cy}`;
              if (drawn.has(key)) return;
              drawn.add(key);
            }

            ctx.beginPath();
            ctx.arc(x, y, 1.5 / transform.k, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      if (showSix) {
        ctx.fillStyle = '#ff6b35';
        const drawnSix = new Set();
        const clusterRes = transform.k < 0.5 ? 4 : (transform.k < 1.5 ? 2 : 0);

        multiplesOf6.forEach(p => {
          const x = p.r * Math.cos(p.theta);
          const y = p.r * Math.sin(p.theta);
          
          const vx = (x * transform.k) + transform.x + width/2;
          const vy = (y * transform.k) + transform.y + height/2;
          
          if (vx > -10 && vx < width + 10 && vy > -10 && vy < height + 10) {
            if (clusterRes > 0) {
              const cx = Math.floor(vx / clusterRes);
              const cy = Math.floor(vy / clusterRes);
              const key = `${cx},${cy}`;
              if (drawnSix.has(key)) return;
              drawnSix.add(key);
            }

            ctx.beginPath();
            ctx.rect(x - 2/transform.k, y - 2/transform.k, 4/transform.k, 4/transform.k);
            ctx.fill();
          }
        });
      }

      ctx.restore();
    }

    const zoom = d3.zoom()
      .scaleExtent([0.1, 100])
      .on('zoom', (event) => {
        transform = event.transform;
        draw();
        status.textContent = `ZOOM_LEVEL: ${transform.k.toFixed(2)}x // COORDS: ${transform.x.toFixed(0)}, ${transform.y.toFixed(0)}`;
      });

    d3.select(canvas).call(zoom);

    // Manual Zoom Controls
    document.getElementById('zoom-in').onclick = () => d3.select(canvas).transition().call(zoom.scaleBy, 1.5);
    document.getElementById('zoom-out').onclick = () => d3.select(canvas).transition().call(zoom.scaleBy, 0.6);
    document.getElementById('reset-view').onclick = () => d3.select(canvas).transition().call(zoom.transform, d3.zoomIdentity);

    // Toggles
    document.getElementById('toggle-primes').onclick = function() {
      showPrimes = !showPrimes;
      this.classList.toggle('active', showPrimes);
      draw();
    };
    document.getElementById('toggle-six').onclick = function() {
      showSix = !showSix;
      this.classList.toggle('active', showSix);
      draw();
    };

    // Tooltip / Proximity
    canvas.addEventListener('mousemove', (e) => {
      if (!isInitialized) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      // Convert mouse to graph coordinates
      const gx = (mx - width / 2 - transform.x) / transform.k;
      const gy = (my - height / 2 - transform.y) / transform.k;

      let closest = null;
      let minDist = 10 / transform.k;

      const dataPool = [];
      if (showPrimes) dataPool.push(...primes);
      if (showSix) dataPool.push(...multiplesOf6);

      dataPool.forEach(p => {
        const px = p.r * Math.cos(p.theta);
        const py = p.r * Math.sin(p.theta);
        const dist = Math.sqrt((gx - px)**2 + (gy - py)**2);
        if (dist < minDist) {
          minDist = dist;
          closest = p;
        }
      });

      if (closest) {
        tooltip.style.display = 'block';
        tooltip.style.left = (mx + 15) + 'px';
        tooltip.style.top = (my + 15) + 'px';
        tooltip.innerHTML = `
          <div style="color:var(--accent)">[ ${closest.type.toUpperCase()} ]</div>
          VALUE: ${closest.n}<br>
          RADIUS: ${closest.r.toFixed(2)}<br>
          THETA: ${closest.theta.toFixed(2)} rad
        `;
      } else {
        tooltip.style.display = 'none';
      }
    });

    // Custom Collapsible Logic
    toggleBtn.addEventListener('click', async () => {
      const isOpen = graphBody.classList.toggle('active');
      if (isOpen && !isInitialized) {
        status.textContent = 'LOADING_DATASET...';
        isInitialized = true; // Set early to allow partial draws
        resize();
        await generateData();
        status.textContent = 'DATASET_ONLINE // SPIRAL_MAPPED';
      } else if (isOpen) {
        resize();
      }
    });

    window.addEventListener('resize', resize);
  })();
